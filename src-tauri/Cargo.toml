[package]
name = "flowdeck"
version = "0.2.0"
description = "A calm, focused personal workbench for tasks, projects and notes"
authors = ["Flowdeck"]
edition = "2021"

[lib]
name = "flowdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
